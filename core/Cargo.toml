[package]
name = "ermiya-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
filetime = "0.2"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"
httpdate = "1.0"

[[bin]]
name = "ermiya-core"
path = "src/main.rs"
